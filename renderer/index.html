<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>claude-work Desk</title>
<link rel="stylesheet" href="../node_modules/highlight.js/styles/github-dark.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="shell">
<div id="pathbar">
  <button id="btn-home" data-i18n-title="tip.home">⌂</button>
  <button id="btn-up" data-i18n-title="tip.up">↑</button>
  <div id="path-input-wrap">
    <input type="text" id="path-input" spellcheck="false" autocomplete="off" data-i18n-ph="ph.path">
    <button id="btn-path-hist" data-i18n-title="tip.history">▾</button>
    <div id="path-hist"></div>
  </div>
  <button id="btn-path-go" data-i18n="btn.go" data-i18n-title="tip.go">Go</button>
</div>
<div id="app">
  <aside id="sidebar">
    <div id="sidebar-header">
      <span id="root-name">claude-work</span>
      <span>
        <button id="btn-settings" data-i18n-title="tip.settings">⚙</button>
        <button id="btn-refresh" data-i18n-title="tip.refresh">⟳</button>
      </span>
    </div>
    <div id="tree"></div>
    <section id="inbox">
      <div id="inbox-header">📥 <span id="inbox-name">_inbox</span><button id="btn-paste" data-i18n-title="tip.paste">📋</button><button id="btn-clear-feed" data-i18n-title="tip.clearFeed">✕</button><span class="hint" data-i18n="inbox.hint"></span></div>
      <div id="inbox-feed"></div>
    </section>
    <div id="sidebar-footer" data-i18n="sidebar.footer"></div>
  </aside>
  <div id="splitter" data-i18n-title="tip.splitter"></div>
  <main id="main">
    <section id="preview">
      <div id="preview-header">
        <span id="preview-title" data-i18n="preview.empty"></span>
        <span id="preview-actions"></span>
      </div>
      <div id="preview-body">
        <div class="welcome">
          <h2>claude-work Desk</h2>
          <p data-i18n="welcome.tree" data-i18n-html></p>
          <p data-i18n="welcome.dragOut" data-i18n-html></p>
          <p data-i18n="welcome.dropIn" data-i18n-html></p>
          <p data-i18n="welcome.dblclick" data-i18n-html></p>
          <p data-i18n="welcome.pathbar" data-i18n-html></p>
          <p data-i18n="welcome.edit" data-i18n-html></p>
        </div>
      </div>
    </section>
  </main>
</div>
</div>
<div id="drop-overlay"><div class="drop-msg" data-i18n="drop.msg"></div></div>
<div id="zoom-toast"></div>
<div id="settings-overlay">
  <div id="settings-panel">
    <h3><span data-i18n="set.title"></span> <span id="set-version"></span></h3>
    <label data-i18n="set.language"></label>
    <select id="set-lang"></select>
    <label data-i18n="set.workspace"></label>
    <div class="root-row"><span id="set-root-path"></span><button id="set-root-change" data-i18n="set.change"></button></div>
    <label data-i18n="set.inbox"></label>
    <input type="text" id="set-inbox" spellcheck="false" autocomplete="off" data-i18n-ph="ph.inbox">
    <label><span data-i18n="set.fontSize"></span> <span id="zoom-val">100%</span> <span data-i18n="set.fontSizeHint"></span></label>
    <input type="range" id="set-zoom" min="50" max="250" step="5" value="100">
    <label data-i18n="set.fontUi"></label>
    <select id="set-font-ui">
      <option value="" data-i18n="set.fontDefaultUi"></option>
      <option value="Meiryo" data-i18n="font.meiryo"></option>
      <option value="Yu Gothic" data-i18n="font.yugothic"></option>
      <option value="BIZ UDPGothic" data-i18n="font.bizudp"></option>
      <option value="UD Digi Kyokasho N-R" data-i18n="font.uddigi"></option>
      <option value="MS PGothic" data-i18n="font.mspgothic"></option>
      <option value="Noto Sans JP">Noto Sans JP</option>
    </select>
    <input type="text" id="set-font-ui-custom" data-i18n-ph="ph.fontCustom">
    <label data-i18n="set.fontMono"></label>
    <select id="set-font-mono">
      <option value="" data-i18n="set.fontDefaultMono"></option>
      <option value="Cascadia Code">Cascadia Code</option>
      <option value="Cascadia Mono">Cascadia Mono</option>
      <option value="BIZ UDGothic" data-i18n="font.bizud"></option>
      <option value="MS Gothic" data-i18n="font.msgothic"></option>
      <option value="Courier New">Courier New</option>
    </select>
    <input type="text" id="set-font-mono-custom" data-i18n-ph="ph.fontCustom">
    <div class="settings-actions">
      <button id="set-reset" data-i18n="set.reset"></button>
      <button id="set-close" data-i18n="set.close"></button>
    </div>
  </div>
</div>
<div id="ctxmenu"></div>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
